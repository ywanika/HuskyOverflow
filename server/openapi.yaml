components:
  schemas:
    # --------------------
    # CORE UTIL SCHEMAS
    # --------------------
    OrderType:
      type: string
      enum:
        - newest
        - unanswered
        - active
        - mostViewed
      default: 'newest'

    VoteResponse:
      type: object
      properties:
        msg:
          type: string
        upVotes:
          type: array
          items:
            type: string
        downVotes:
          type: array
          items:
            type: string

    # --------------------
    # QUESTION SCHEMAS
    # --------------------
    VoteBody:
      type: object
      required:
        - qid
        - username
      properties:
        qid:
          type: string
          description: Unique identifier of the question.
        username:
          type: string
          description: Username of the user casting the vote.

    TagBody:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          description: The name of the tag.
        description:
          type: string
          minLength: 1
          description: A brief description of the tag's purpose or usage.

    NewQuestionBody:
      type: object
      required:
        - title
        - text
        - tags
        - askedBy
        - askDateTime
      properties:
        title:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagBody'
          minItems: 1
          description: Array of Tag objects, each requiring a name and description.
        askedBy:
          type: string
          minLength: 1
        askDateTime:
          type: string
          format: date-time
        community:
          type: string
          format: object-id
          nullable: true

    PopulatedQuestion:
      type: object
      description: A fully populated question object with embedded tags, answers, and comments.

    # --------------------
    # ANSWER SCHEMAS
    # --------------------
    AnswerBody:
      type: object
      required:
        - text
        - ansBy
        - ansDateTime
      properties:
        text:
          type: string
          minLength: 1
        ansBy:
          type: string
          minLength: 1
        ansDateTime:
          type: string
          format: date-time

    AddAnswerBody:
      type: object
      required:
        - qid
        - ans
      properties:
        qid:
          type: string
          format: object-id
          description: The ID of the question the answer belongs to.
        ans:
          $ref: '#/components/schemas/AnswerBody'

    DatabaseAnswer:
      type: object
      description: An answer object as stored in the database.

    # --------------------
    # TAG SCHEMAS
    # --------------------
    DatabaseTag:
      type: object
      description: A tag object as stored in the database.

    # --------------------
    # COMMENT SCHEMAS
    # --------------------
    CommentBody:
      type: object
      required:
        - text
        - commentBy
        - commentDateTime
      properties:
        text:
          type: string
          minLength: 1
        commentBy:
          type: string
          minLength: 1
        commentDateTime:
          type: string
          format: date-time

    AddCommentBody:
      type: object
      required:
        - id
        - type
        - comment
      properties:
        id:
          type: string
          format: object-id
          description: The ID of the parent (question or answer).
        type:
          type: string
          enum:
            - question
            - answer
          description: The type of document the comment is attached to.
        comment:
          $ref: '#/components/schemas/CommentBody'

    DatabaseComment:
      type: object
      description: A comment object as stored in the database.

    # --------------------
    # MESSAGE SCHEMAS
    # --------------------
    MessageBody:
      type: object
      required:
        - msg
        - msgFrom
        - msgDateTime
      properties:
        msg:
          type: string
          minLength: 1
        msgFrom:
          type: string
          minLength: 1
        msgDateTime:
          type: string
          format: date-time

    AddMessageBody:
      type: object
      required:
        - messageToAdd
      properties:
        messageToAdd:
          $ref: '#/components/schemas/MessageBody'

    DatabaseMessage:
      type: object
      description: A message object as stored in the database.

    # --------------------
    # CHAT SCHEMAS
    # --------------------
    CreateChatBody:
      type: object
      required:
        - participants
        - messages
      properties:
        participants:
          type: array
          minItems: 1
          items:
            type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageBody'

    AddParticipantBody:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: The username of the new participant.

    PopulatedChat:
      type: object
      description: A fully populated chat object with embedded messages.

    # --------------------
    # GAME SCHEMAS
    # --------------------
    GameType:
      type: string
      enum: # Based on known game types like 'Nim'
        - Nim
        - TBD_OtherGame
      description: The type of game to create.

    GameStatus:
      type: string
      enum:
        - WAITING_TO_START
        - IN_PROGRESS
        - OVER
      description: The status of the game.

    CreateGameBody:
      type: object
      required:
        - gameType
      properties:
        gameType:
          $ref: '#/components/schemas/GameType'

    GameActionBody:
      type: object
      required:
        - gameID
        - playerID
      properties:
        gameID:
          type: string
          format: object-id
        playerID:
          type: string

    PopulatedGame:
      type: object
      description: A fully populated game instance object.

    # --------------------
    # COLLECTION SCHEMAS
    # --------------------
    CreateCollectionBody:
      type: object
      required:
        - name
        - description
        - questions
        - username
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        questions:
          type: array
          items:
            type: string
            format: object-id
        username:
          type: string
          minLength: 1
        isPrivate:
          type: boolean
          default: false

    ToggleSaveQuestionBody:
      type: object
      required:
        - collectionId
        - questionId
        - username
      properties:
        collectionId:
          type: string
          format: object-id
        questionId:
          type: string
          format: object-id
        username:
          type: string

    PopulatedCollection:
      type: object
      description: A fully populated collection object.

    # --------------------
    # COMMUNITY SCHEMAS
    # --------------------
    CommunityVisibility:
      type: string
      enum:
        - PUBLIC
        - PRIVATE

    ToggleMembershipBody:
      type: object
      required:
        - communityId
        - username
      properties:
        communityId:
          type: string
          format: object-id
        username:
          type: string

    CreateCommunityBody:
      type: object
      required:
        - name
        - description
        - admin
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        admin:
          type: string
          minLength: 1
        visibility:
          $ref: '#/components/schemas/CommunityVisibility'
          default: PUBLIC
        participants:
          type: array
          items:
            type: string
          default: []

    DeleteCommunityBody:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          description: The username of the admin performing the deletion.

    DatabaseCommunity:
      type: object
      description: A community object as stored in the database.

    # --------------------
    # USER SCHEMAS
    # --------------------
    UserSignupBody:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
          description: Optional user email.
        biography:
          type: string
          default: ''
          description: Optional user biography.

    UserLoginBody:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    UpdateBiographyBody:
      type: object
      required:
        - username
        - biography
      properties:
        username:
          type: string
          minLength: 1
        biography:
          type: string

    SuspendUserBody:
      type: object
      required:
        - username
        - durationDays
        - reason
        - adminUsername
      properties:
        username:
          type: string
          minLength: 1
          description: The username of the user to suspend.
        durationDays:
          type: integer
          minimum: 1
          maximum: 30
          description: Duration of suspension in days (1-30).
        reason:
          type: string
          minLength: 1
          description: Reason for suspension.
        adminUsername:
          type: string
          minLength: 1
          description: The username of the admin performing the action.

    BanUserBody:
      type: object
      required:
        - username
        - reason
        - adminUsername
      properties:
        username:
          type: string
          minLength: 1
          description: The username of the user to ban.
        reason:
          type: string
          minLength: 20
          description: Detailed reason for ban (minimum 20 characters).
        adminUsername:
          type: string
          minLength: 1
          description: The username of the admin performing the action.

    UserRoleChangeBody:
      type: object
      required:
        - username
        - adminUsername
      properties:
        username:
          type: string
          minLength: 1
          description: The username of the user whose role is being changed.
        adminUsername:
          type: string
          minLength: 1
          description: The username of the admin performing the action.

    SuspensionStatusResponse:
      type: object
      properties:
        isSuspended:
          type: boolean
          description: Whether the user is currently suspended.
        suspendedUntil:
          type: string
          format: date-time
          nullable: true
          description: The date/time when suspension ends (null if not suspended).
        suspensionReason:
          type: string
          nullable: true
          description: Reason for suspension (null if not suspended).
        isBanned:
          type: boolean
          description: Whether the user is permanently banned.
        banReason:
          type: string
          nullable: true
          description: Reason for ban (null if not banned).

    User:
      type: object
      description: A user profile object.

    # --------------------
    # NOTIFICATION SCHEMAS
    # --------------------
    NotificationType:
      type: string
      enum:
        - deletion
        - appeal_result
        - flag
        - suspension
        - role_change
        - system_announcement
      description: The type of notification.

    DatabaseNotification:
      type: object
      description: A notification object as stored in the database.
      properties:
        _id:
          type: string
          format: object-id
          description: Unique identifier for the notification.
        recipientUsername:
          type: string
          description: Username of the user receiving the notification.
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          description: Message content of the notification.
        contentId:
          type: string
          format: object-id
          nullable: true
          description: ObjectId of the related content (for appeals, etc.).
        isRead:
          type: boolean
          description: Whether the notification has been read.
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the notification was created.

    CreateSystemNotificationBody:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: The message content for the system-wide notification.

    # --------------------
    # ADMIN SCHEMAS
    # --------------------
    CreateUserWithRoleBody:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          minLength: 1
          description: The username for the new user account.
        password:
          type: string
          minLength: 1
          description: The password for the new user account.
        role:
          type: string
          enum:
            - user
            - moderator
            - admin
          description: The role to assign to the new user.

    AuditLog:
      type: object
      description: An audit log entry tracking admin actions.
      properties:
        _id:
          type: string
          format: object-id
          description: Unique identifier for the audit log entry.
        adminUsername:
          type: string
          description: The username of the admin who performed the action.
        actionType:
          type: string
          description: The type of action performed (e.g., 'create_user', 'view_dashboard_metrics').
        targetUser:
          type: string
          nullable: true
          description: The username of the user targeted by the action (if applicable).
        targetContent:
          type: string
          nullable: true
          description: The ID of content targeted by the action (if applicable).
        reason:
          type: string
          nullable: true
          description: The reason for the action (if applicable).
        timestamp:
          type: string
          format: date-time
          description: The timestamp when the action was performed.

    DashboardMetrics:
      type: object
      description: Comprehensive dashboard metrics for admin users.
      properties:
        users:
          type: object
          properties:
            total:
              type: integer
            newThisWeek:
              type: integer
            newThisMonth:
              type: integer
            byRole:
              type: object
              properties:
                user:
                  type: integer
                moderator:
                  type: integer
                admin:
                  type: integer
            active:
              type: integer
              description: Users active in last 7 days
            suspended:
              type: integer
        content:
          type: object
          properties:
            questions:
              type: object
              properties:
                total:
                  type: integer
                withAnswers:
                  type: integer
                unanswered:
                  type: integer
                flagged:
                  type: integer
                deleted:
                  type: integer
            answers:
              type: object
              properties:
                total:
                  type: integer
                flagged:
                  type: integer
                deleted:
                  type: integer
            comments:
              type: object
              properties:
                total:
                  type: integer
                flagged:
                  type: integer
                deleted:
                  type: integer
        engagement:
          type: object
          properties:
            totalViews:
              type: integer
            totalUpvotes:
              type: integer
            totalDownvotes:
              type: integer
            averageAnswersPerQuestion:
              type: number
            averageCommentsPerAnswer:
              type: number
        moderation:
          type: object
          properties:
            totalFlagged:
              type: integer
            totalReviewed:
              type: integer
            totalDeleted:
              type: integer
            pendingReview:
              type: integer
        tags:
          type: object
          properties:
            total:
              type: integer
            mostUsed:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  count:
                    type: integer
        communities:
          type: object
          properties:
            total:
              type: integer
            public:
              type: integer
            private:
              type: integer
        collections:
          type: object
          properties:
            total:
              type: integer
        messages:
          type: object
          properties:
            total:
              type: integer
        growth:
          type: object
          properties:
            questionsByWeek:
              type: array
              items:
                type: object
                properties:
                  week:
                    type: string
                  count:
                    type: integer
            usersByWeek:
              type: array
              items:
                type: object
                properties:
                  week:
                    type: string
                  count:
                    type: integer

    # --------------------
    # MODERATION SCHEMAS
    # --------------------
    DeleteContentBody:
      type: object
      required:
        - moderatorUsername
        - deleteReason
      properties:
        moderatorUsername:
          type: string
          minLength: 1
          description: The username of the moderator performing the deletion.
        deleteReason:
          type: string
          minLength: 1
          description: The reason for deleting the content.

    FlagContentBody:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          description: The username of the user flagging the content.

    ReviewContentBody:
      type: object
      required:
        - contentType
        - contentId
        - moderatorUsername
      properties:
        contentType:
          type: string
          enum:
            - question
            - answer
            - comment
          description: The type of content being reviewed or dismissed.
        contentId:
          type: string
          format: object-id
          description: The unique ID of the content.
        moderatorUsername:
          type: string
          minLength: 1
          description: The username of the moderator performing the action.

    RestoreContentBody:
      type: object
      required:
        - contentType
        - contentId
        - moderatorUsername
      properties:
        contentType:
          type: string
          enum:
            - question
            - answer
            - comment
          description: The type of content being restored.
        contentId:
          type: string
          format: object-id
          description: The unique ID of the content to restore.
        moderatorUsername:
          type: string
          minLength: 1
          description: The username of the moderator performing the restoration.

    DeletedContentItem:
      type: object
      description: A deleted content item with metadata.
      properties:
        _id:
          type: string
          description: The unique ID of the deleted content.
        contentType:
          type: string
          enum:
            - question
            - answer
            - comment
          description: The type of content.
        content:
          type: object
          description: The actual content object (question, answer, or comment).
        deletedBy:
          type: string
          description: Username of the moderator who deleted this content.
        deleteReason:
          type: string
          description: The reason provided for deletion.
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the content was deleted.
        authorUsername:
          type: string
          description: Username of the original author.
        contentPreview:
          type: string
          description: First 100 characters of the content (title for questions, text for answers/comments).
        restoredAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the content was restored (if applicable).

    DeletedContentResponse:
      type: object
      description: Response containing all deleted content by a specific moderator.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeletedContentItem'
          description: Array of deleted content items sorted by deletion time (most recent first).
        error:
          type: string
          nullable: true
          description: Error message if an error occurred.

    FlaggedContentItem:
      type: object
      description: A flagged content item with metadata.
      properties:
        _id:
          type: string
          description: The unique ID of the flagged content.
        contentType:
          type: string
          enum:
            - question
            - answer
            - comment
          description: The type of content.
        content:
          type: object
          description: The actual content object (question, answer, or comment).
        flaggedBy:
          type: array
          items:
            type: string
          description: Array of usernames who flagged this content.
        flaggedAt:
          type: array
          items:
            type: string
            format: date-time
          description: Array of timestamps when the content was flagged.
        reviewedBy:
          type: string
          nullable: true
          description: Username of the moderator who reviewed this content (if reviewed).
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the content was reviewed (if reviewed).

    FlaggedContentResponse:
      type: object
      description: Response containing all flagged content organized by type.
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FlaggedContentItem'
          description: Array of flagged questions.
        answers:
          type: array
          items:
            $ref: '#/components/schemas/FlaggedContentItem'
          description: Array of flagged answers.
        comments:
          type: array
          items:
            $ref: '#/components/schemas/FlaggedContentItem'
          description: Array of flagged comments.
        error:
          type: string
          nullable: true
          description: Error message if an error occurred.

    SimpleErrorBody: # MODIFICATION: New schema for simple JSON errors like 403, 404
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A detailed error message.

  responses:
    # --------------------
    # RESPONSE SCHEMAS
    # --------------------
    ErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: The error message returned by the server.
    ValidationError:
      description: Bad Request / Validation Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: The error message from express-openapi-validator.
              errors:
                type: array
                description: Detailed list of validation errors.